<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Cpath d=%27M2 13V7M6 13V3M10 13V9M14 13V5%27 stroke=%27%23d97757%27 stroke-width=%272%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<style>
:root {
  --background: #fcfcfc;
  --surface: #ffffff;
  --foreground: #18181b;
  --contrast-foreground: #18181b;
  --muted: #f4f4f5;
  --muted-foreground: #71717a;
  --border: #e4e4e7;
  --border-soft: rgba(228, 228, 231, 0.6);
  --hover: rgba(24, 24, 27, 0.04);
  --warning: #b45309;
  --danger: #b91c1c;
  --ring: #2563eb;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: #101012;
    --surface: #18181b;
    --foreground: #fafafa;
    --contrast-foreground: #fafafa;
    --muted: rgba(255, 255, 255, 0.05);
    --muted-foreground: #a3a3a3;
    --border: rgba(255, 255, 255, 0.1);
    --border-soft: rgba(255, 255, 255, 0.06);
    --hover: rgba(255, 255, 255, 0.05);
    --warning: #fbbf24;
    --danger: #f87171;
    --ring: #60a5fa;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: #101012;
  --surface: #18181b;
  --foreground: #fafafa;
  --contrast-foreground: #fafafa;
  --muted: rgba(255, 255, 255, 0.05);
  --muted-foreground: #a3a3a3;
  --border: rgba(255, 255, 255, 0.1);
  --border-soft: rgba(255, 255, 255, 0.06);
  --hover: rgba(255, 255, 255, 0.05);
  --warning: #fbbf24;
  --danger: #f87171;
  --ring: #60a5fa;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--background);
  color: var(--foreground);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.tabular { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
header.bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  min-height: 48px; padding: 6px 20px;
  background: var(--background); border-bottom: 1px solid var(--border);
}
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 auto; }
.crumbs h1 { margin: 0; font-size: 14px; font-weight: 600; }
.crumbs .sep { color: var(--muted-foreground); opacity: .6; }
.window-label { color: var(--muted-foreground); font-size: 12px; margin-left: 8px; white-space: nowrap; }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.link-btn {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; margin: 0 -6px;
  background: none; border: 0; border-radius: 6px; cursor: pointer; color: var(--foreground);
}
.link-btn:hover { background: var(--hover); }
.chev { width: 14px; height: 14px; opacity: .6; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--muted); }
.seg button {
  padding: 3px 10px; border: 0; border-radius: 6px; background: transparent; cursor: pointer;
  color: var(--muted-foreground); font-size: 12.5px;
}
.seg button:hover { color: var(--foreground); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--foreground); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
  border: 0; border-radius: 8px; background: none; cursor: pointer; color: var(--muted-foreground);
}
.icon-btn:hover { background: var(--hover); color: var(--foreground); }
.icon-btn[disabled] { opacity: .5; cursor: default; }
.icon-btn svg { width: 16px; height: 16px; }
.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn {
  padding: 5px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 13px;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--foreground); color: var(--background); border-color: var(--foreground); }
.btn[disabled] { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* menus */
.menu-wrap { position: relative; }
.menu {
  position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; min-width: 220px; padding: 4px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
}
.menu[hidden] { display: none; }
.menu label, .menu button.item {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px;
  background: none; cursor: pointer; text-align: left; font-size: 13px;
}
.menu label:hover, .menu button.item:hover { background: var(--hover); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.menu input[type=checkbox] { accent-color: var(--foreground); }

/* layout */
main { max-width: 76rem; margin: 0 auto; padding: 24px 20px 64px; display: flex; flex-direction: column; gap: 24px; }
h2 { margin: 0; font-size: 14px; font-weight: 600; }
h3 { margin: 0; font-size: 14px; font-weight: 600; }
.notes p { margin: 0 0 6px; color: var(--muted-foreground); font-size: 13px; }
.notes p.warn { color: var(--warning); }
.overview { display: grid; gap: 24px; grid-template-columns: minmax(0, 18rem) minmax(0, 1fr); }
@media (max-width: 860px) { .overview { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.total-figure { font-size: 36px; line-height: 1.1; font-weight: 600; }
.sub { font-size: 12px; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 4px; }
.info { cursor: help; display: inline-flex; }
.info svg { width: 12px; height: 12px; }
.prow { display: flex; flex-direction: column; gap: 3px; }
.prow .line { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.prow .name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.prow .name .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .name .count { font-size: 11px; color: var(--muted-foreground); white-space: nowrap; }
.prow .value { font-weight: 500; }
.prow .detail { font-size: 12px; color: var(--muted-foreground); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.mark { width: 16px; height: 16px; flex: none; }
.metrics { display: grid; gap: 16px 24px; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 4px 0; }
@media (max-width: 760px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.metric .k { font-size: 12px; color: var(--muted-foreground); }
.metric .v { font-size: 16px; font-weight: 500; }
.shares { display: grid; gap: 32px 48px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 860px) { .shares { grid-template-columns: minmax(0, 1fr); } }
.share { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.share .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sharebar { display: flex; gap: 2px; height: 8px; }
.sharebar div { min-width: 4px; height: 100%; border-radius: 2px; }
.sharebar div:first-child { border-radius: 999px 2px 2px 999px; }
.sharebar div:last-child { border-radius: 2px 999px 999px 2px; }
.sharebar div:only-child { border-radius: 999px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

/* chart */
.chart { display: flex; flex-direction: column; gap: 4px; }
.chart .row { display: flex; gap: 8px; }
.chart .yaxis { position: relative; width: 56px; height: 224px; flex: none; }
.chart .yaxis span { position: absolute; right: 0; transform: translateY(-50%); font-size: 10px; color: var(--muted-foreground); }
.chart .plot { position: relative; flex: 1; height: 224px; }
.chart svg:not(.mark) { width: 100%; height: 100%; display: block; }
.chart .xaxis { display: flex; justify-content: space-between; padding-left: 64px; font-size: 10px; color: var(--muted-foreground); text-transform: uppercase; }
.tip {
  position: absolute; z-index: 10; min-width: 144px; max-width: 100%; padding: 8px 10px; pointer-events: none;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); font-size: 12px;
}
.tip .t { color: var(--muted-foreground); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--muted-foreground); }
.tip .tot { margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--border); }

/* tables */
.break-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { font-weight: 400; font-size: 12px; color: var(--muted-foreground); padding: 8px 0 8px 24px; border-bottom: 1px solid var(--border); text-align: right; }
td { padding: 10px 0 10px 24px; text-align: right; color: var(--muted-foreground); border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
th:first-child, td:first-child { padding-left: 8px; width: 1%; text-align: left; }
th.left, td.left { text-align: left; }
td.left { white-space: normal; width: 100%; }
td.strong { color: var(--foreground); }
td:last-child, th:last-child { padding-right: 8px; }
tbody tr:hover { background: var(--hover); }
.model-btn { display: flex; align-items: center; gap: 8px; padding: 0; background: none; border: 0; cursor: pointer; color: var(--foreground); text-align: left; }
.model-btn:hover { text-decoration: underline; }
.mbar { height: 2px; max-width: 12rem; margin-top: 6px; }
.mbar div { height: 100%; border-radius: 999px; }
.scroll-x { overflow-x: auto; }
@media (max-width: 640px) { .hide-sm { display: none; } }

/* limits */
.limits { display: flex; flex-direction: column; gap: 28px; }
.lprov { display: flex; flex-direction: column; gap: 12px; }
.lprov .title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lprov .plan { font-size: 12px; color: var(--muted-foreground); }
.lgrid { display: grid; grid-template-columns: 11rem minmax(0, 1fr) 7rem; gap: 4px 16px; align-items: center; }
@media (max-width: 640px) { .lgrid { grid-template-columns: minmax(0, 8rem) minmax(0, 1fr) auto; gap: 2px 10px; } }
.lgrid .lab { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; }
.lgrid .lab .n { color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lgrid .lab .pct { margin-left: auto; font-weight: 500; white-space: nowrap; }
.lgrid .rs { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
.lgrid .rs .t { margin-left: auto; }
.lbar { position: relative; height: 24px; }
.lbar .track { position: absolute; left: 0; right: 0; top: 6px; bottom: 6px; border-radius: 999px; background: var(--muted); border: 1px solid var(--border-soft); }
.lbar .fill { position: absolute; left: 0; top: 6px; bottom: 6px; border-radius: 999px; }
.lbar .tick { position: absolute; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; border-radius: 999px; background: var(--foreground); }
.pace { display: inline-flex; color: var(--muted-foreground); }
.pace svg { width: 14px; height: 14px; }
.empty { padding: 48px 0; text-align: center; color: var(--muted-foreground); }
.empty code { background: var(--muted); padding: 2px 6px; border-radius: 6px; }
.callout { padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; color: var(--muted-foreground); }

/* dialogs */
dialog {
  width: min(48rem, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--border);
  border-radius: 16px; background: var(--surface); color: var(--foreground); box-shadow: var(--shadow);
}
dialog.wide { width: min(56rem, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
.dlg-head { padding: 20px 24px 8px; display: flex; flex-direction: column; gap: 2px; }
.dlg-head .t { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; }
.dlg-body { padding: 12px 24px 20px; display: flex; flex-direction: column; gap: 28px; overflow: auto; }
.dlg-foot { padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--border); }
.stats { display: grid; gap: 16px 24px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stats .k { font-size: 12px; color: var(--muted-foreground); }
.stats .v { font-size: 24px; font-weight: 600; }
.pgrid { display: grid; gap: 28px 40px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 640px) { .pgrid { grid-template-columns: minmax(0, 1fr); } }
.price-table input {
  width: 100%; min-width: 4.5rem; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--background); color: var(--foreground); font: inherit; text-align: right;
}
.price-table input.model { text-align: left; min-width: 10rem; }
.price-table td, .price-table th { padding-left: 8px; }
.err { color: var(--danger); font-size: 12px; }
</style>
</head>
<body>
<header class="bar">
  <div class="crumbs">
    <h1>Usage</h1>
    <span class="sep" aria-hidden="true">/</span>
    <div class="menu-wrap">
      <button id="provider-btn" class="link-btn" aria-haspopup="true" aria-expanded="false"><span id="provider-label">All providers</span>
        <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
      <div id="provider-menu" class="menu" role="group" aria-label="Providers" hidden></div>
    </div>
    <span id="window-label" class="window-label"></span>
  </div>
  <div class="controls">
    <div id="period-seg" class="seg" role="group" aria-label="Usage period"></div>
    <div id="metric-seg" class="seg" role="group" aria-label="Usage metric"></div>
    <button id="prices-btn" class="btn" type="button">Model prices</button>
    <button id="theme-btn" class="icon-btn" type="button" title="Theme" aria-label="Toggle theme"></button>
    <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh usage" title="Refresh">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.97"/><path d="M13.5 2.5v3h-3"/></svg>
    </button>
  </div>
</header>
<main id="app" aria-live="polite"></main>

<dialog id="model-dialog" aria-labelledby="model-title"></dialog>
<dialog id="price-dialog" class="wide" aria-labelledby="price-title"></dialog>

<script>
// BEGIN USAGE MODEL
// Pure logic: formatting, windows, merging, pricing overrides, limits presentation, chart math.
// Ported from T3 Code's usageFormat.ts, usageMerge.ts, usageLimits.ts, usageBreakdown.ts and
// UsageProviderChart.tsx (MIT, T3 Tools Inc.). No DOM access in this block.
'use strict';

const PROVIDER_ORDER = ['codex', 'claude', 'grok', 'opencode', 'antigravity', 'pi'];
const PROVIDERS = {
  codex: { label: 'Codex', color: 'var(--contrast-foreground)' },
  claude: { label: 'Claude Code', color: '#d97757' },
  grok: { label: 'Grok Build', color: 'color-mix(in oklab, var(--contrast-foreground) 72%, var(--background))' },
  opencode: { label: 'OpenCode', color: '#5b9bbd' },
  antigravity: { label: 'Antigravity', color: '#8c7bd1' },
  pi: { label: 'Pi', color: '#4d9f8a' },
};
const METRICS = [
  { value: 'cost', label: 'Cost', key: 'c' },
  { value: 'tokens', label: 'Tokens', key: 't' },
  { value: 'limits', label: 'Limits', key: 'l' },
];
const WINDOWS = [
  { days: 1, label: 'Past 24h', digit: '1' },
  { days: 7, label: '7 days', digit: '2' },
  { days: 30, label: '30 days', digit: '3' },
  { days: 90, label: '90 days', digit: '4' },
];
const MINUTE = 60000;
const HOUR = 60 * MINUTE;
const DAY = 24 * HOUR;

const USD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const INT = new Intl.NumberFormat('en-US');

function formatUsd(v) { return USD.format(v); }
function formatCount(v) { return INT.format(Math.round(v)); }
function trimDigits(v) {
  const abs = Math.abs(v);
  const digits = abs >= 100 ? 0 : abs >= 10 ? 1 : 2;
  return v.toFixed(digits).replace(/\.0+$/, '');
}
function formatTokens(v) {
  const abs = Math.abs(v);
  if (abs >= 1e12) return trimDigits(v / 1e12) + 'T';
  if (abs >= 1e9) return trimDigits(v / 1e9) + 'B';
  if (abs >= 1e6) return trimDigits(v / 1e6) + 'M';
  if (abs >= 1e3) return trimDigits(v / 1e3) + 'K';
  return INT.format(Math.round(v));
}
function formatPercent(share, digits) {
  digits = digits === undefined ? 1 : digits;
  const percent = share * 100;
  const smallest = Math.pow(10, -digits);
  if (percent > 0 && percent < smallest) return '<' + smallest.toFixed(digits) + '%';
  return percent.toFixed(digits) + '%';
}
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function formatDayShort(day) {
  const p = day.split('-').map(Number);
  if (p.length !== 3 || p.some(Number.isNaN)) return day;
  return (MONTHS[p[1] - 1] || '') + ' ' + p[2];
}
function enumerateDays(since, until) {
  const out = [];
  const start = Date.parse(since + 'T00:00:00Z');
  const end = Date.parse(until + 'T00:00:00Z');
  if (Number.isNaN(start) || Number.isNaN(end) || end < start) return out;
  for (let t = start; t <= end; t += DAY) out.push(new Date(t).toISOString().slice(0, 10));
  return out;
}
function validZone(name) {
  if (!name) return undefined;
  try { new Intl.DateTimeFormat('en-US', { timeZone: name }); return name; } catch (e) { return undefined; }
}
function dayIn(tz, ms) {
  const opts = { year: 'numeric', month: '2-digit', day: '2-digit' };
  if (tz) opts.timeZone = tz;
  return new Intl.DateTimeFormat('en-CA', opts).format(new Date(ms));
}
function isoHour(ms) { return new Date(ms).toISOString().slice(0, 19) + 'Z'; }
function floorHourIn(tz, ms) {
  const opts = { minute: 'numeric', second: 'numeric', hourCycle: 'h23' };
  if (tz) opts.timeZone = tz;
  const parts = new Intl.DateTimeFormat('en-US', opts).formatToParts(new Date(ms));
  const get = (t) => Number((parts.find((p) => p.type === t) || { value: 0 }).value);
  const sub = Math.floor(ms / 1000) * 1000;
  return sub - (get('minute') * 60 + get('second')) * 1000;
}
/** The window for a period: 24 hourly buckets for "Past 24h", otherwise `days` calendar days. */
function makeWindow(days, nowMs, tz) {
  const today = dayIn(tz, nowMs);
  if (days === 1) {
    const end = floorHourIn(tz, nowMs);
    const hours = [];
    for (let k = 23; k >= 0; k--) hours.push(isoHour(end - k * HOUR));
    return { days, hourly: true, hours, dayList: [], sinceDay: dayIn(tz, end - 23 * HOUR), untilDay: today, tz, untilTime: isoHour(end + HOUR), sinceTime: hours[0] };
  }
  const since = new Date(Date.parse(today + 'T00:00:00Z') - (days - 1) * DAY).toISOString().slice(0, 10);
  return { days, hourly: false, hours: [], dayList: enumerateDays(since, today), sinceDay: since, untilDay: today, tz };
}
function hourFormatter(tz, hour12, extra) {
  const o = Object.assign({ hour: hour12 ? 'numeric' : '2-digit' }, hour12 ? {} : { hourCycle: 'h23' }, extra || {});
  if (tz) o.timeZone = tz;
  if (hour12) o.hour12 = true;
  return new Intl.DateTimeFormat('en-US', o);
}
function formatHourShort(iso, tz, hour12) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  const f = hourFormatter(tz, hour12);
  if (hour12) return f.format(d);
  return f.formatToParts(d).map((p) => (p.type === 'hour' ? p.value + ':00' : p.value)).join('');
}
function formatDateTimeShort(iso, tz, hour12) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  const f = hourFormatter(tz, hour12, { month: 'short', day: 'numeric' });
  if (hour12) return f.format(d);
  return f.formatToParts(d).map((p) => (p.type === 'hour' ? p.value + ':00' : p.value)).join('');
}
function formatRelativeHourShort(iso, relativeTo, tz, hour12) {

const VIEW_W = 960, VIEW_H = 260, PLOT_TOP = 8, TICKS = 4;

    const a = slopes[i - 1] || 0, b = slopes[i] || 0;
    tg[i] = a * b <= 0 ? 0 : (a + b) / 2;

}

      (t.x - dx / 3).toFixed(2) + ',' + (t.y - (tg[i + 1] * dx) / 3).toFixed(2) + ' ' + t.x.toFixed(2) + ',' + t.y.toFixed(2);

  const fmt = metric === 'tokens' ? formatTokens : formatUsd;
  const refTime = win.untilTime;
  const fmtPeriod = (k) => (win.hourly ? formatRelativeHourShort(k, refTime, win.tz, hour12) : formatDayShort(k));
  const line = plot.querySelector('.hover-line');
  let tip = null;
  const hide = () => { if (tip) { tip.remove(); tip = null; } line.style.display = 'none'; };
  plot.addEventListener('mouseleave', hide);
  plot.addEventListener('mousemove', (ev) => {
    if (!keys.length) return;
    const box = plot.getBoundingClientRect();
    if (box.width === 0) return;
    const x = Math.min(box.width, Math.max(0, ev.clientX - box.left));
    const y = Math.min(box.height, Math.max(0, ev.clientY - box.top));
    const idx = Math.min(keys.length - 1, Math.max(0, Math.round((x / box.width) * (keys.length - 1))));
    const col = chart.columns[idx];
    line.setAttribute('x1', idx * chart.stepX); line.setAttribute('x2', idx * chart.stepX); line.style.display = '';
    if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; plot.appendChild(tip); }
    tip.innerHTML = '<div class="t">' + esc(fmtPeriod(keys[idx])) + '</div>' + providers.map((p) =>
      '<div class="r"><span>' + mark(p, 12) + esc(PROVIDERS[p].label) + '</span><span class="tabular">' + fmt(col.bands[PROVIDER_ORDER.indexOf(p)].value) + '</span></div>').join('') +
      '<div class="r tot"><span>Total</span><span class="tabular">' + fmt(col.total) + '</span></div>';
    const gap = 12, tw = tip.offsetWidth, th = tip.offsetHeight;
    const left = x + gap + tw <= box.width ? x + gap : x - gap - tw;
    const top = y + gap + th <= box.height ? y + gap : y - gap - th;
    tip.style.left = Math.min(Math.max(0, left), Math.max(0, box.width - tw)) + 'px';
    tip.style.top = Math.min(Math.max(0, top), Math.max(0, box.height - th)) + 'px';
  });
}

function shareBar(label, segments, fmt, aside) {
  const visible = segments.filter((s) => s.value > 0);
  const total = visible.reduce((s, x) => s + x.value, 0);
  if (total <= 0) return '';
  const summary = label + ': ' + visible.map((s) => s.label + ' ' + fmt(s.value)).join(', ');
  return '<div class="share"><div class="head"><h3>' + esc(label) + '</h3>' + (aside || '') + '</div>' +
    '<div class="sharebar" role="img" aria-label="' + esc(summary) + '">' +
    visible.map((s) => '<div style="flex:' + s.value + ' 1 0;background:' + s.color + '" title="' + esc(s.label + ' · ' + fmt(s.value) + ' · ' + formatPercent(s.value / total)) + '"></div>').join('') + '</div>' +
    '<div class="legend">' + visible.map((s) => '<span><i style="background:' + s.color + '"></i><span class="muted">' + esc(s.label) + '</span><span class="tabular">' + esc(fmt(s.value)) + '</span></span>').join('') + '</div></div>';
}
function speedPremium(usd) {
  return '<span class="sub">Premium <span class="tabular" style="color:var(--foreground)">' + formatUsd(usd) + '</span></span>';
}

function freshnessHtml(data) {
  const generated = Date.parse(data.generatedAt);
  const stale = state.now - generated > 24 * HOUR;
  const bits = ['Updated ' + formatAgo(state.now - generated)];
  if (data.scanDurationMs) bits.push('scanned in ' + (data.scanDurationMs / 1000).toFixed(1) + 's');
  const pr = data.pricing || {};
  bits.push(pr.status === 'unavailable' ? 'prices unavailable' : 'prices ' + pr.status + (pr.knownModels ? ' (' + formatCount(pr.knownModels) + ' models)' : ''));
  let html = '<p' + (stale ? ' class="warn"' : '') + '>' + esc(bits.join(' · ')) + (stale ? '. This data is more than a day old; press Refresh.' : '') + '</p>';
  if (pr.status === 'unavailable') html += '<p class="warn">Model prices could not be loaded and none are cached, so costs are unknown. Connect to the internet and refresh, or set prices under Model prices.</p>';
  if (state.refreshError) html += '<p class="warn">' + esc(state.refreshError) + '</p>';
  return html;
}

function renderLimits() {
  const lim = state.data.limits;
  const now = state.now;
  const hidden = hiddenSet();
  let body;
  if (!lim) {
    body = '<div class="empty">Limits were not collected. Refresh to read them.</div>';
  } else {
    const entries = lim.providers.filter((e) => !hidden.has(e.provider));
    if (entries.length === 0) {
      body = '<div class="empty">No Claude Code, Codex or OpenCode Go login was found on this machine, so there are no limits to show.<br>Sign in with <code>claude</code>, <code>codex login</code> or <code>opencode auth login</code>, then press Refresh.</div>';
    } else {
      body = '<div class="limits">' + entries.map((e) => {
        let inner;
        if (e.unavailable || e.windows.length === 0) {
          inner = '<div class="callout">' + esc((e.unavailable && e.unavailable.message) || 'No limits reported.') + '</div>';
        } else {
          inner = '<div class="lgrid">' + e.windows.map((w) => {
            const remaining = remainingPercent(w);
            const left = paceRemainingPercent(w, now);
            const pace = paceOf(w, now);
            const resets = formatResetsIn(w, now);
            const resetsAt = w.resetsAt ? new Date(w.resetsAt).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : null;
            const summary = w.label + ': ' + remaining + '% left' + (left === null ? '' : ', ' + left + '% of the window left') + (resets ? ', ' + resets : '');
            const tip = remaining + '% left' + (left !== null ? ' · ' + left + '% of the window left (the line is where even spending would be)' : '') + (resetsAt ? '. Resets ' + resetsAt : '');
            const tickLeft = left === null ? null : 'clamp(3px,' + left + '%,calc(100% - 3px))';
            return '<span class="lab"><span class="n">' + esc(w.label) + '</span><span class="pct tabular">' + remaining + '% left</span></span>' +
              '<div class="lbar" role="img" tabindex="0" aria-label="' + esc(summary) + '" title="' + esc(tip) + '"><div class="track"></div>' +
              (remaining > 0 ? '<div class="fill" style="width:' + remaining + '%;background:' + PROVIDERS[e.provider].color + '"></div>' : '') +
              (tickLeft ? '<span class="tick" style="left:' + tickLeft + '"></span>' : '') + '</div>' +
              '<span class="rs tabular">' + (pace ? paceIcon(pace) : '') + '<span class="t">' + esc(resets || '') + '</span></span>';
          }).join('') + '</div>';
        }
        return '<section class="lprov"><div class="title">' + mark(e.provider, 20) + '<h2>' + esc(PROVIDERS[e.provider].label) + '</h2>' + (e.plan ? '<span class="plan">' + esc(e.plan) + '</span>' : '') +
          (e.stale ? '<span class="plan" title="' + esc(e.error || 'The latest read failed.') + '">last good reading, ' + esc(formatAgo(now - Date.parse(e.checkedAt))) + '</span>' : '') + '</div>' + inner + '</section>';
      }).join('') + '</div>';
    }
  }
  const checked = lim ? '<p>Checked ' + esc(formatAgo(now - Date.parse(lim.checkedAt))) + '. Limits come straight from each provider using your saved login.</p>' : '';
  $('#app').innerHTML = '<div class="notes">' + checked + (state.refreshError ? '<p class="warn">' + esc(state.refreshError) + '</p>' : '') + '</div>' + body;
}

let priceDrafts = [];
function openPriceDialog(initialModel) {

function savePrices() {
  const errors = {};
  const next = {};
  priceDrafts.forEach((d, i) => {
    if (!d.model.trim() && PRICE_FIELDS.every((f) => !String(d[f.key]).trim())) return;
    const parsed = parsePriceForm(d);
    if (!parsed) errors[i] = d.model.trim() ? 'Input and output prices are required, as non-negative numbers.' : 'Enter a model ID.';
    else if (next[parsed.model]) errors[i] = 'This model already has a row.';
    else next[parsed.model] = parsed.price;
  });
  if (Object.keys(errors).length) { renderPriceDialog(errors); return; }
  state.overrides = next;
  writeJson(PRICE_KEY, next);
  $('#price-dialog').close();
  render();
}

// ---- data loading and refresh ----
async function loadData() {
  try {
    const res = await fetch('data/usage.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.data = await res.json();
    state.loadError = null;
  } catch (e) {
    if (!state.data) state.loadError = state.serverAvailable ? 'Could not load data/usage.json.' : null;
  }
  state.now = Date.now();
}
async function refresh(scope) {
  if (state.refreshing) return;
  if (!state.serverAvailable) { state.refreshError = 'Refresh needs the local server: run python3 bin/usage_tracker.py.'; render(); return; }
  state.refreshing = true; state.refreshError = null; render();
  try {
    const res = await fetch('/api/refresh' + (scope === 'limits' ? '?scope=limits' : ''), { method: 'POST', headers: { 'X-Usage-Tracker': '1' } });
    const body = await res.json().catch(() => ({}));
    if (!res.ok || !body.ok) state.refreshError = body.error || 'Refresh failed.';
    await loadData();
  } catch (e) {
    state.refreshError = 'Could not reach the local server.';
  }
  state.refreshing = false; state.now = Date.now(); render();
}
function selectMetric(metric) {
  state.prefs.metric = metric; savePrefs(); state.now = Date.now(); render();
  if (metric === 'limits' && state.serverAvailable && (!state.data || !state.data.limits || Date.now() - Date.parse(state.data.limits.checkedAt) > MINUTE)) refresh('limits');
}
function selectPeriod(days) { state.prefs.windowDays = days; savePrefs(); render(); }

// ---- events ----
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button, input, label');
  const menu = $('#provider-menu');
  if (!ev.target.closest('.menu-wrap')) { menu.hidden = true; $('#provider-btn').setAttribute('aria-expanded', 'false'); }
  if (!t) return;
  if (t.id === 'provider-btn') { menu.hidden = !menu.hidden; t.setAttribute('aria-expanded', String(!menu.hidden)); return; }
  if (t.id === 'refresh-btn') { refresh(state.prefs.metric === 'limits' ? 'limits' : 'all'); return; }
  if (t.id === 'theme-btn') { const order = ['system', 'light', 'dark']; state.prefs.theme = order[(order.indexOf(state.prefs.theme) + 1) % 3]; savePrefs(); renderThemeButton(); return; }
  if (t.id === 'prices-btn') { openPriceDialog(); return; }
  const d = t.dataset || {};
  if (d.period) selectPeriod(Number(d.period));
  else if (d.metric) selectMetric(d.metric);
  else if (d.breakdown) { state.breakdown = d.breakdown; render(); }
  else if (d.model) { state.selectedModel = d.model; renderModelDialog(); }
  else if (d.close === 'model') { state.selectedModel = null; $('#model-dialog').close(); }
  else if (d.close === 'price') { $('#price-dialog').close(); }
  else if (d.setPrice !== undefined) { state.selectedModel = null; $('#model-dialog').close(); openPriceDialog(d.setPrice); }
  else if (d.addDraft !== undefined) { priceDrafts.push(newDraft('')); renderPriceDialog([]); }
  else if (d.removeDraft !== undefined) { priceDrafts.splice(Number(d.removeDraft), 1); renderPriceDialog([]); }
  else if (d.savePrices !== undefined) savePrices();
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.providerAll !== undefined) { state.prefs.hiddenProviders = el.checked ? [] : PROVIDER_ORDER.slice(); savePrefs(); render(); $('#provider-menu').hidden = false; return; }
  if (el.dataset && el.dataset.provider) {
    const hidden = hiddenSet();
    if (el.checked) hidden.delete(el.dataset.provider); else hidden.add(el.dataset.provider);
    state.prefs.hiddenProviders = PROVIDER_ORDER.filter((p) => hidden.has(p)); savePrefs(); render(); $('#provider-menu').hidden = false;
  }
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.draft !== undefined) priceDrafts[Number(el.dataset.draft)][el.dataset.field] = el.value;
});
for (const id of ['model-dialog', 'price-dialog']) {
  $('#' + id).addEventListener('close', () => { if (id === 'model-dialog') state.selectedModel = null; });
  $('#' + id).addEventListener('click', (ev) => { if (ev.target === ev.currentTarget) { if (id === 'model-dialog') state.selectedModel = null; ev.currentTarget.close(); } });
}
// Shortcuts: C, T, L pick the metric; Ctrl/Cmd+Shift+1..4 (or plain 1..4) pick the period.
window.addEventListener('keydown', (ev) => {
  if (ev.defaultPrevented || ev.repeat || ev.isComposing) return;
  const t = ev.target;
  if (t instanceof HTMLElement && (['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName) || t.isContentEditable)) return;
  if (document.querySelector('dialog[open]')) return;
  const key = ev.key.toLowerCase();
  const plain = !ev.ctrlKey && !ev.metaKey && !ev.altKey && !ev.shiftKey;
  const metric = plain && METRICS.find((m) => m.key === key);
  const digit = /^Digit([1-4])$/.exec(ev.code || '');
  const period = digit && ((ev.shiftKey && (ev.ctrlKey || ev.metaKey)) || plain) && WINDOWS.find((w) => w.digit === digit[1]);
  if (!metric && !period) return;
  ev.preventDefault();
  if (metric) selectMetric(metric.value);
  else if (state.prefs.metric !== 'limits') selectPeriod(period.days);
}, true);

(async function init() {
  render();
  await loadData();
  render();
  if (state.prefs.metric === 'limits' && state.serverAvailable && state.data) selectMetric('limits');
})();
</script>
</body>
